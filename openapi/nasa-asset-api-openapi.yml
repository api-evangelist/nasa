openapi: 3.2.0
info:
  title: NASA Image and Video Library Asset API
  description: The NASA Image and Video Library API provides access to NASA's media archive including images, videos, and audio. Users can search, retrieve metadata, captions, and asset manifests.
  version: 1.0.0
  contact:
    name: NASA API Support
    url: https://api.nasa.gov
servers:
- url: https://images-api.nasa.gov
tags:
- name: Asset
paths:
  /asset/{nasa_id}:
    get:
      operationId: getAsset
      summary: NASA Get media asset manifest
      description: Returns a manifest of available media files for a NASA ID.
      parameters:
      - name: nasa_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  collection:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            href:
                              type: string
                              format: uri
      tags:
      - Asset
