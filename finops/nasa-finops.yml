description: 'FOCUS-aligned FinOps for NASA Open APIs: zero-cost public-good APIs whose only meaningful
  consumption signal is request volume per key. No invoiced charges; cost concerns are limited to internal
  consumer-side observability and rate-limit avoidance.'
sources:
