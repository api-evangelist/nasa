naftiko: 1.0.0-alpha2
info:
  label: NASA Image and Video Library API — Asset
  description: 'NASA Image and Video Library API — Asset. 1 operations. Lead operation: NASA Get media asset manifest. Self-contained
    Naftiko capability covering one Nasa business surface.'
  tags:
  - Nasa
  - Asset
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    NASA_API_KEY: NASA_API_KEY
capability:
  consumes:
  - type: http
    namespace: nasa-image-and-video-library-asset
    baseUri: https://images-api.nasa.gov
    description: NASA Image and Video Library API — Asset business capability. Self-contained, no shared references.
    resources:
    - name: asset-nasa_id
      path: /asset/{nasa_id}
      operations:
      - name: getasset
        method: GET
        description: NASA Get media asset manifest
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: nasa_id
          in: path
          type: string
          required: true
  exposes:
  - type: rest
    namespace: nasa-image-and-video-library-asset-rest
    port: 8080
    description: REST adapter for NASA Image and Video Library API — Asset. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/asset/{nasa-id}
      name: asset-nasa-id
      description: REST surface for asset-nasa_id.
      operations:
      - method: GET
        name: getasset
        description: NASA Get media asset manifest
        call: nasa-image-and-video-library-asset.getasset
        with:
          nasa_id: rest.nasa_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: nasa-image-and-video-library-asset-mcp
    port: 9090
    transport: http
    description: MCP adapter for NASA Image and Video Library API — Asset. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: nasa-get-media-asset-manifest
      description: NASA Get media asset manifest
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: nasa-image-and-video-library-asset.getasset
      with:
        nasa_id: tools.nasa_id
      outputParameters:
      - type: object
        mapping: $.
