naftiko: 1.0.0-alpha2
info:
  label: NASA Image and Video Library API — Metadata
  description: 'NASA Image and Video Library API — Metadata. 1 operations. Lead operation: NASA Get media metadata location.
    Self-contained Naftiko capability covering one Nasa business surface.'
  tags:
  - Nasa
  - Metadata
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    NASA_API_KEY: NASA_API_KEY
capability:
  consumes:
  - type: http
    namespace: nasa-image-and-video-library-metadata
    baseUri: https://images-api.nasa.gov
    description: NASA Image and Video Library API — Metadata business capability. Self-contained, no shared references.
    resources:
    - name: metadata-nasa_id
      path: /metadata/{nasa_id}
      operations:
      - name: getmetadata
        method: GET
        description: NASA Get media metadata location
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: nasa_id
          in: path
          type: string
          required: true
  exposes:
  - type: rest
    namespace: nasa-image-and-video-library-metadata-rest
    port: 8080
    description: REST adapter for NASA Image and Video Library API — Metadata. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/metadata/{nasa-id}
      name: metadata-nasa-id
      description: REST surface for metadata-nasa_id.
      operations:
      - method: GET
        name: getmetadata
        description: NASA Get media metadata location
        call: nasa-image-and-video-library-metadata.getmetadata
        with:
          nasa_id: rest.nasa_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: nasa-image-and-video-library-metadata-mcp
    port: 9090
    transport: http
    description: MCP adapter for NASA Image and Video Library API — Metadata. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: nasa-get-media-metadata-location
      description: NASA Get media metadata location
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: nasa-image-and-video-library-metadata.getmetadata
      with:
        nasa_id: tools.nasa_id
      outputParameters:
      - type: object
        mapping: $.
