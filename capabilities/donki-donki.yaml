        with:
          startDate: rest.startDate
          endDate: rest.endDate
          api_key: rest.api_key
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/donki/sep
      name: donki-sep
      description: REST surface for DONKI-SEP.
      operations:
      - method: GET
        name: getsolarenergeticparticles
        description: NASA Get solar energetic particle events
        call: donki-donki.getsolarenergeticparticles
        with:
          startDate: rest.startDate
          endDate: rest.endDate
          api_key: rest.api_key
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/donki/notifications
      name: donki-notifications
      description: REST surface for DONKI-notifications.
      operations:
      - method: GET
        name: getdonkinotifications
        description: NASA Get space weather notifications
        call: donki-donki.getdonkinotifications
        with:
          startDate: rest.startDate
          endDate: rest.endDate
          type: rest.type
          api_key: rest.api_key
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: donki-donki-mcp
    port: 9090
    transport: http
    description: MCP adapter for NASA DONKI (Space Weather Database Of Notifications, Knowledge, Information) API — DONKI.
      One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: nasa-get-coronal-mass-ejection
      description: NASA Get coronal mass ejection events
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: donki-donki.getcoronalmassejections
      with:
        startDate: tools.startDate
        endDate: tools.endDate
        api_key: tools.api_key
      outputParameters:
      - type: object
        mapping: $.
    - name: nasa-get-cme-analysis-data
